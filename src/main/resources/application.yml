server:
  port: 8123
  servlet:
    context-path: /api
    #cookie 30 天后过期
    session:
      cookie:
        max-age: 2592000

spring:
  application:
    name: picture-backend
    #数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/picture?allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
  #  profiles:
  #    active: local
  servlet:
    multipart:
      max-file-size: 10MB
  #Redis数据库配置
  redis:
    database: 3
    host: 127.0.0.1
    port: 6379
    connect-timeout: 5000
  #Session配置
  session:
    store-type: redis
    #30天后过期
    timeout: 2592000
mybatis-plus:
  configuration:
    # MyBatis 配置
    map-underscore-to-camel-case: false
    #仅在开发环境打印日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1 #逻辑删除字段值
      logic-not-delete-value: 0

#接口文档配置
knife4j:
  enable: true
  openapi:
    title: 接口文档
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.lgh.picturebackend.controller

